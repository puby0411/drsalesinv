<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Punch Clock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-firestore-compat.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* Layout: a time-card station. One wide clock card for punching; admin desk below a tab rail of plain tables. */
:root{
  --paper:#EEF2F0; --card:#FFFFFF; --sunk:#F6F8F7; --ink:#17201D; --muted:#5A6762; --line:#D3DBD7;
  --accent:#0E6B5B; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --ribbon:#B3261E; --ribbon-soft:#F8E1DF; --ok:#1E7A3B;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1513; --card:#171F1C; --sunk:#131A18; --ink:#E4EBE8; --muted:#94A49E; --line:#2A3632;
  --accent:#45B8A0; --accent-ink:#06211B; --accent-soft:#163731;
  --ribbon:#F07A70; --ribbon-soft:#3A1E1C; --ok:#63CB8E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1513; --card:#171F1C; --sunk:#131A18; --ink:#E4EBE8; --muted:#94A49E; --line:#2A3632;
  --accent:#45B8A0; --accent-ink:#06211B; --accent-soft:#163731;
  --ribbon:#F07A70; --ribbon-soft:#3A1E1C; --ok:#63CB8E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700;font-stretch:110%}
h3{font-size:1rem;font-weight:700}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:0}
.brand b{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:1.15rem;letter-spacing:.02em;text-transform:uppercase}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.in{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ot{background:var(--ribbon-soft);color:var(--ribbon);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:600 .9rem var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

/* cards & forms */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 140px}
.field.sm{flex:0 1 120px}
label{font-size:.78rem;font-weight:600;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink);font-weight:500}
.check input{width:auto}
.btn{appearance:none;font:600 .9rem var(--f-body);border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--ribbon);border-color:var(--ribbon)}
.btn.ghost{border-color:transparent;background:none;padding:6px 10px}
.btn.ghost:hover{background:var(--sunk)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.8rem}

/* clock card */
.timecard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);overflow:hidden}
.timecard .face{padding:28px 28px 24px;display:flex;flex-direction:column;gap:6px;border-right:1.5px dashed var(--line);position:relative}
.timecard .face::before,.timecard .face::after{content:"";position:absolute;right:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.timecard .face::before{top:-9px}.timecard .face::after{bottom:-9px}
.bigtime{font-family:var(--f-display);font-weight:800;font-stretch:72%;font-size:clamp(3.4rem,13vw,6.6rem);line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bigtime small{font-size:.38em;font-stretch:100%;color:var(--muted);margin-left:.15em;font-weight:600}
.today{font-weight:600;color:var(--muted)}
.stamp{align-self:flex-start;margin-top:14px;font-family:var(--f-mono);font-weight:600;font-size:.95rem;padding:6px 12px;border:2px solid currentColor;border-radius:4px;transform:rotate(-2deg);letter-spacing:.06em}
.stamp.in{color:var(--accent)}.stamp.out{color:var(--muted)}
.punch{padding:24px;display:flex;flex-direction:column;gap:14px;justify-content:center;background:var(--sunk)}
.punchbtn{appearance:none;border:0;border-radius:12px;padding:22px 18px;font:800 1.5rem var(--f-display);font-stretch:118%;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.punchbtn span{font:500 .8rem var(--f-body);letter-spacing:0;text-transform:none;opacity:.85}
.punchbtn.in{background:var(--accent);color:var(--accent-ink)}
.punchbtn.out{background:var(--ribbon);color:#fff}
.punchbtn[disabled]{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.countdown{font-size:.85rem;color:var(--muted);text-align:center}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:140px}
.ot-mark{color:var(--ribbon);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:.9rem}

/* payslip preview */
.slip{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:18px}
.slip-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.slip-head h2{font-stretch:125%;text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px 20px}
.kv div{display:flex;flex-direction:column}
.kv b{font-weight:600}
.net{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;background:var(--accent-soft);border-radius:8px;flex-wrap:wrap}
.net b{font-family:var(--f-mono);font-size:1.6rem;color:var(--accent);font-variant-numeric:tabular-nums}

/* login / setup */
.gate{max-width:420px;width:100%;margin:6vh auto 0;display:flex;flex-direction:column;gap:18px}
.gate .bigtime{font-size:clamp(3rem,16vw,4.6rem);text-align:center}
.gate .today{text-align:center}
.note{font-size:.85rem;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.err{color:var(--ribbon);font-size:.85rem;font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.toast.bad{background:var(--ribbon);color:#fff}
.inline-confirm{display:inline-flex;gap:6px;align-items:center;font-size:.82rem}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

@media (max-width:700px){
  .timecard{grid-template-columns:1fr}
  .timecard .face{border-right:0;border-bottom:1.5px dashed var(--line)}
  .timecard .face::before,.timecard .face::after{top:auto;bottom:-9px;right:auto}
  .timecard .face::before{left:-9px}.timecard .face::after{right:-9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading the time clock…</div></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} }
};
const pad = n => String(n).padStart(2,"0");
const dayKey = ms => { const d=new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const startOfDay = (d=new Date()) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
const parseDay = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).getTime(); };
const fmtTime = ms => ms ? new Date(ms).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : "—";
const fmtDate = ms => new Date(ms).toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
const fmtDayKey = k => fmtDate(parseDay(k));
const fmtLong = ms => new Date(ms).toLocaleDateString([], {month:"long", day:"numeric", year:"numeric"});
const toLocalInput = ms => { if(!ms) return ""; const d=new Date(ms); return `${dayKey(ms)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hm = mins => { mins=Math.max(0,Math.round(mins)); return `${Math.floor(mins/60)}h ${pad(mins%60)}m`; };
const hdec = mins => (Math.max(0,mins)/60).toFixed(2);
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
function money(n){
  const cur = (S.settings.currency || "PHP").toUpperCase();
  try { return new Intl.NumberFormat("en-PH", {style:"currency", currency:cur}).format(n||0); }
  catch(e){ return cur + " " + (n||0).toFixed(2); }
}
const plainMoney = n => (S.settings.currency || "PHP").toUpperCase() + " " + (n||0).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
async function hashPin(username, pin){
  const text = "punchclock:" + username.toLowerCase() + ":" + pin;
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  } catch(e){
    let h=5381; for(const c of text) h=((h<<5)+h+c.charCodeAt(0))|0; return "f"+(h>>>0).toString(16);
  }
}

/* ---------- state ---------- */
const S = {
  db:null, dl:null, status:"loading",
  loaded:{staff:false, roles:false, settings:false, devices:false},
  staff:[], roles:[], devices:[], settings:{company:"", currency:"PHP", kiosk:true, deviceLock:false},
  meId: ls.get("pc.session"), tab: ls.get("pc.tab") || "clock",
  mine:[], mineLoaded:false, open:[], today:[], leaves:[], leaveFilter:"all",
  drafts:{}, err:{}, confirm:null, editPunch:null, editRole:null, editStaff:null,
  rec:{staffId:"all", from:"", to:"", rows:null, unsub:null},
  slip:{staffId:"", from:"", to:"", punches:null, adj:[], loading:false},
  logoutAt:null, busy:false
};
const subs = {};
/* device identity: a random id kept in this browser's storage */
const DEVICE_ID = (() => {
  let id = ls.get("pc.device");
  if(!id){ id = "d" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); ls.set("pc.device", id); if(ls.get("pc.device") !== id) return null; }
  return id;
})();
const thisDevice = () => DEVICE_ID ? S.devices.find(d => d.id === DEVICE_ID) || null : null;
const deviceOk = () => !S.settings.deviceLock || !!thisDevice();
function guessDeviceName(){
  const ua = navigator.userAgent || "";
  const os = /iPad/.test(ua) ? "iPad" : /iPhone/.test(ua) ? "iPhone" : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows PC" : /Linux/.test(ua) ? "Linux PC" : "Device";
  const br = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Browser";
  return `${br} on ${os}`;
}
const me = () => S.staff.find(s => s.id === S.meId) || null;
const roleOf = st => S.roles.find(r => r.id === st?.roleId) || null;
const staffName = id => S.staff.find(s => s.id === id)?.name || "Removed staff";
const D = (k, def="") => (k in S.drafts) ? S.drafts[k] : def;
const clearDrafts = prefix => { for(const k of Object.keys(S.drafts)) if(k.startsWith(prefix)) delete S.drafts[k]; };

function toast(text, bad){
  const t=document.getElementById("toast"); t.textContent=text; t.className="toast"+(bad?" bad":""); t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>{t.hidden=true;}, 3800);
}

/* cutoff presets (1–15 / 16–end) */
function cutoff(which){
  const now=new Date(); let y=now.getFullYear(), m=now.getMonth();
  const first = now.getDate()<=15;
  const endOf = (y,m) => new Date(y,m+1,0).getDate();
  const k = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
  if(which==="current") return first ? [k(y,m,1),k(y,m,15)] : [k(y,m,16),k(y,m,endOf(y,m))];
  if(which==="previous"){
    if(first){ m--; if(m<0){m=11;y--;} return [k(y,m,16),k(y,m,endOf(y,m))]; }
    return [k(y,m,1),k(y,m,15)];
  }
  if(which==="month") return [k(y,m,1),k(y,m,endOf(y,m))];
}

/* ---------- shifts & pay calculation ---------- */
const DEFAULT_SHIFT = {start:"08:00", end:"17:00", breakStart:"12:00", breakEnd:"13:00"};
const toMin = s => { const m=/^(\d{1,2}):(\d{2})/.exec(s||""); return m ? (+m[1])*60+(+m[2]) : null; };
const at = (dayMs, mins) => { const d=new Date(dayMs); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, mins).getTime(); };
const ov = (a0,a1,b0,b1) => Math.max(0, Math.min(a1,b1)-Math.max(a0,b0));
const hasShift = sh => !!(sh && toMin(sh.start)!=null && toMin(sh.end)!=null);
function shiftOf(st){
  if(hasShift(st?.shift)) return st.shift;
  const r=roleOf(st); if(hasShift(r?.shift)) return r.shift;
  return DEFAULT_SHIFT;
}
/* the shift's working window on a given day, minus its break */
function shiftWindow(dayMs, sh){
  const s=toMin(sh.start)??480; let e=toMin(sh.end)??1020; if(e<=s) e+=1440;
  const ws=at(dayMs,s), we=at(dayMs,e);
  let segs=[[ws,we]];
  let bs=toMin(sh.breakStart), be=toMin(sh.breakEnd);
  if(bs!=null && be!=null){
    if(bs<s) bs+=1440; if(be<=bs) be+=1440;
    if(be<=e){ segs=[[ws,at(dayMs,bs)],[at(dayMs,be),we]]; }
  }
  return {ws, we, segs, target: Math.round(segs.reduce((a,[x,y])=>a+(y-x)/60000,0))};
}
const crossesMidnight = sh => (toMin(sh.end)??0) <= (toMin(sh.start)??0);
/* overnight shifts belong to the day they started, even if someone clocks in after midnight */
const shiftDayOf = (ms, sh) => dayKey(crossesMidnight(sh) ? ms - 6*3600000 : ms);
const shiftHours = sh => shiftWindow(new Date(2026,0,5).getTime(), sh).target/60;
const fmtHM = s => { const m=toMin(s); if(m==null) return "—"; const h=Math.floor(m/60)%24; return `${((h+11)%12)+1}:${pad(m%60)} ${h<12?"AM":"PM"}`; };
const fmtShift = sh => `${fmtHM(sh.start)} – ${fmtHM(sh.end)}`;
const fmtBreak = sh => (toMin(sh.breakStart)!=null && toMin(sh.breakEnd)!=null) ? `${fmtHM(sh.breakStart)} – ${fmtHM(sh.breakEnd)}` : "No break";
function rates(role, sh){
  const hrs = shiftHours(sh) || 8, rate = +role.rate||0;
  const dayRate = role.basis==="hourly" ? rate*hrs : rate;
  const hourly = role.basis==="hourly" ? rate : rate/hrs;
  const otRate = role.otMode==="fixed" ? (+role.otValue||0) : hourly*(+role.otValue||0);
  return {hrs, dayRate, hourly, otRate};
}
const otMinOf = () => { const v=S.settings.otMinMins; return (v===0 || +v>0) ? +v : 60; };
/* minutes worked outside the shift window today, for the live views */
function outsideToday(ps, sh){
  const w=shiftWindow(startOfDay(), sh), now=Date.now();
  return ps.reduce((a,p)=>{ const o=p.out||now; return a + ((o-p.in) - ov(p.in,o,w.ws,w.we))/60000; },0);
}
function computePay(role, punches, sh){
  const {hrs, dayRate, hourly, otRate} = rates(role, sh);
  const deduct = S.settings.deductShort!==false, otMin = otMinOf();
  const sorted=[...punches].sort((a,b)=>a.in-b.in), lines=[], byDay={};
  for(const p of sorted){
    if(!p.out){ lines.push({...p, mins:null}); continue; }
    lines.push({...p, mins:Math.max(0,Math.round((p.out-p.in)/60000))});
    (byDay[shiftDayOf(p.in, sh)] ||= []).push(p);
  }
  const dayRows=[]; let shortM=0, otM=0;
  for(const k of Object.keys(byDay).sort()){
    const w=shiftWindow(parseDay(k), sh);
    let total=0, inWin=0, inside=0;
    for(const p of byDay[k]){
      total += (p.out-p.in)/60000;
      inWin += ov(p.in,p.out,w.ws,w.we)/60000;
      for(const [a,b] of w.segs) inside += ov(p.in,p.out,a,b)/60000;
    }
    total=Math.round(total); inside=Math.min(Math.round(inside), w.target);
    const outside=Math.max(0, total-Math.round(inWin));
    const ot = outside>=otMin ? outside : 0;
    const short = deduct ? Math.max(0, w.target-inside) : 0;
    shortM+=short; otM+=ot;
    dayRows.push({k, total, inside, outside, ot, short});
  }
  const days=dayRows.length;
  const regFull=round2(days*dayRate), deduction=round2(shortM/60*hourly);
  const regPay=round2(regFull-deduction), otPay=round2(otM/60*otRate);
  return {lines, dayRows, days, hrs, dayRate, hourly, otRate, regFull, shortM, deduction, regPay, otM, otPay,
    gross:round2(regPay+otPay), openCount: lines.filter(l=>l.mins==null).length, otMin, deduct};
}
const LEAVE_TYPES = ["Vacation","Sick","Emergency","Maternity / Paternity","Bereavement","Other"];
const dayCount = (a,b) => Math.round((parseDay(b)-parseDay(a))/86400000)+1;
const leaveDays = l => l.half ? 0.5 : dayCount(l.from,l.to);
const fmtRange = (a,b) => a===b ? fmtDayKey(a) : `${fmtDayKey(a)} – ${fmtDayKey(b)}`;
function leaveSummary(staffId, role, from, to){
  const items=S.leaves.filter(l=>l.staffId===staffId && l.from<=to && l.to>=from).sort((a,b)=>a.from.localeCompare(b.from));
  let paid=0, unpaid=0;
  const rows=items.map(l=>{ const s=l.from>from?l.from:from, e=l.to<to?l.to:to, d=l.half?0.5:dayCount(s,e); if(l.paid) paid+=d; else unpaid+=d; return {...l, s, e, d}; });
  const dayRate=rates(role, shiftOf(S.staff.find(s=>s.id===staffId))).dayRate;
  return {rows, paid, unpaid, dayRate, pay:round2(paid*dayRate)};
}

/* Every Punch Clock collection starts with pc_ so it never mixes with the POS
   collections (users, products, sales, expenses, saleApprovals). */
const PREFIX = "pc_";
function dbError(e){
  console.error(e);
  if(S.status==="dberr") return;
  S.status="dberr"; S.dberr = e?.code || e?.message || "unknown"; render();
}
(async () => {
  render();
  if(typeof firebase === "undefined"){ dbError({code:"sdk-missing"}); return; }
  let fs;
  try{
    const app = firebase.apps.find(a=>a.name==="punchclock") || firebase.initializeApp(firebaseConfig, "punchclock");
    fs = app.firestore();
    fs.settings({ experimentalAutoDetectLongPolling: true, useFetchStreams: false, ignoreUndefinedProperties: true });
  }catch(e){ dbError(e); return; }
  const db = { collection: n => fs.collection(PREFIX+n), doc: p => fs.doc(PREFIX+p) };
  S.db = db;
  const fail = e => dbError(e);
  db.collection("staff").onSnapshot(s => { S.staff = s.docs.map(d=>({id:d.id, ...d.data()})); S.loaded.staff=true; afterLoad(); }, fail);
  db.collection("roles").onSnapshot(s => { S.roles = s.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>a.name.localeCompare(b.name)); S.loaded.roles=true; afterLoad(); }, fail);
  db.doc("config/settings").onSnapshot(s => { if(s.exists) S.settings = {company:"", currency:"PHP", kiosk:true, deviceLock:false, ...s.data()}; S.loaded.settings=true; afterLoad(); }, fail);
  db.collection("devices").onSnapshot(s => { S.devices = s.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.created||0)-(b.created||0)); S.loaded.devices=true; afterLoad(); }, fail);
})();

function afterLoad(){
  if(!(S.loaded.staff && S.loaded.roles && S.loaded.settings && S.loaded.devices)) return;
  if(S.status==="loading") S.status="ready";
  const m = me();
  if(S.meId && (!m || m.active===false)){ logout(); return; }
  startSubs();
  render();
}

function stopSub(k){ if(subs[k]){ try{subs[k]();}catch(e){} delete subs[k]; } }
function startSubs(){
  const m = me();
  const key = m ? m.id + (m.isAdmin?":a":"") : "";
  if(subs._key === key) return;
  ["mine","open","today","leaves"].forEach(stopSub); subs._key = key;
  S.mine=[]; S.mineLoaded=false; S.open=[]; S.today=[]; S.leaves=[];
  if(!m) return;
  subs.mine = S.db.collection("punches").where("staffId","==",m.id)
    .onSnapshot(s => { S.mine = s.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>b.in-a.in).slice(0,60); S.mineLoaded=true; render(); }, dbError);
  if(m.isAdmin){
    subs.open = S.db.collection("punches").where("open","==",true)
      .onSnapshot(s => { S.open = s.docs.map(d=>({id:d.id, ...d.data()})); render(); }, ()=>{});
    subs.today = S.db.collection("punches").where("in",">=",startOfDay()).orderBy("in","desc")
      .onSnapshot(s => { S.today = s.docs.map(d=>({id:d.id, ...d.data()})); render(); }, ()=>{});
    subs.leaves = S.db.collection("leaves").orderBy("from","desc").limit(1000)
      .onSnapshot(s => { S.leaves = s.docs.map(d=>({id:d.id, ...d.data()})); render(); }, ()=>{});
  }
}
function logout(){
  S.meId=null; ls.set("pc.session", null); S.logoutAt=null; S.drafts={}; S.err={};
  stopSub("recs"); S.rec.rows=null; S.slip.punches=null; subs._key=undefined; startSubs(); render();
}

function viewToday(){
  const byStaff = {};
  for(const p of S.today){ (byStaff[p.staffId] ||= []).push(p); }
  for(const p of S.open){ if(!(byStaff[p.staffId]||[]).some(x=>x.id===p.id)) (byStaff[p.staffId] ||= []).push(p); }
  const active = S.staff.filter(s=>s.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
  const rows = active.map(s=>{
    const ps=(byStaff[s.id]||[]).sort((a,b)=>a.in-b.in), open=ps.find(p=>p.open);
    const mins=ps.filter(p=>p.in>=startOfDay()).reduce((a,p)=>a+((p.out||Date.now())-p.in)/60000,0);
    const sh=shiftOf(s), tk=dayKey(Date.now()), w=shiftWindow(startOfDay(), sh);
    const tps=ps.filter(p=>p.in>=startOfDay()), outside=outsideToday(tps, sh);
    const late = tps[0] ? Math.round((tps[0].in-w.ws)/60000) : 0;
    const leave=S.leaves.find(l=>l.staffId===s.id && l.from<=tk && l.to>=tk);
    return {s,ps,open,mins,sh,outside,late,leave};
  });
  const otMin=otMinOf();
  const inCount = rows.filter(r=>r.open).length;
  return `<section class="panel">
    <div class="hrow"><h2>Who's on the clock</h2><span class="chip in"><span class="dot"></span>${inCount} of ${active.length} clocked in</span></div>
    <div class="tbl"><table><thead><tr><th>Staff</th><th>Shift</th><th>Status</th><th>First in</th><th>Last out</th><th class="r">Today</th><th class="r">Outside shift</th></tr></thead><tbody>
    ${rows.map(r=>{
      const first=r.ps[0], lastOut=[...r.ps].reverse().find(p=>p.out);
      return `<tr><td>${esc(r.s.name)}<div class="muted" style="font-size:.78rem">${esc(roleOf(r.s)?.name||"No role")}</div></td><td class="num">${esc(fmtShift(r.sh))}</td>
      <td>${r.open?`<span class="chip in"><span class="dot"></span>In since ${esc(fmtTime(r.open.in))}</span>`:(r.ps.length?`<span class="chip">Clocked out</span>`:(r.leave?`<span class="chip ot">On ${esc(r.leave.type.toLowerCase())} leave${r.leave.half?" (half day)":""}</span>`:`<span class="chip">Not in today</span>`))}</td>
      <td class="num">${first?esc(fmtTime(first.in))+(r.late>0?` <span class="ot-mark" style="font-size:.78rem">late ${hm(r.late)}</span>`:""):"—"}</td><td class="num">${lastOut?esc(fmtTime(lastOut.out)):"—"}</td>
      <td class="num r">${r.ps.length?hm(r.mins):"—"}</td>
      <td class="num r ${r.outside>=otMin?"ot-mark":""}">${r.ps.length?hm(r.outside):"—"}</td></tr>`;}).join("") || `<tr><td colspan="7" class="empty">No staff yet. Add people on the Staff tab.</td></tr>`}
    </tbody></table></div>
  </section>`;
}

/* shift inputs, shared by the role and staff forms */
function shiftFields(p, sh){
  sh = sh || DEFAULT_SHIFT;
  const f = (k,label) => `<div class="field sm" style="flex-basis:130px"><label for="${p}${k}">${label}</label><input id="${p}${k}" type="time" data-k="${p}${k}" value="${esc(D(p+k, sh[k]||""))}"></div>`;
  return f("start","Shift start")+f("end","Shift end")+f("breakStart","Break start")+f("breakEnd","Break end");
}
function readShift(p, sh){
  sh = sh || DEFAULT_SHIFT;
  const g = k => String(D(p+k, sh[k]||"")).slice(0,5);
  const out = {start:g("start"), end:g("end"), breakStart:g("breakStart"), breakEnd:g("breakEnd")};
  if(toMin(out.start)==null || toMin(out.end)==null) return {error:"Enter a shift start and end time."};
  if(out.start===out.end) return {error:"Shift start and end can't be the same time."};
  const hasB = toMin(out.breakStart)!=null, hasE = toMin(out.breakEnd)!=null;
  if(hasB!==hasE) return {error:"Enter both break times, or clear both for no break."};
  if(hasB){
    const full = shiftWindow(new Date(2026,0,5).getTime(), {start:out.start, end:out.end});
    if(shiftWindow(new Date(2026,0,5).getTime(), out).target===full.target) return {error:"The break must fall inside the shift."};
  } else { out.breakStart=""; out.breakEnd=""; }
  if(shiftHours(out) < 1) return {error:"The shift needs at least 1 working hour after the break."};
  return {shift:out};
}

    ${S.err.lock?`<div class="err">${esc(S.err.lock)}</div>`:""}
    <div><button class="btn primary" data-act="save-lock">Save device lock</button></div>
  </section>`;
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById("app");
  const a=document.activeElement, fid=a&&a.id, sel=(a&&"selectionStart" in a)?(()=>{try{return [a.selectionStart,a.selectionEnd];}catch(e){return null;}})():null;
  let html="";
  if(S.status==="loading") html=`<div class="empty">Loading the time clock…</div>`;
  else if(S.status==="dberr") html=viewNoDb();
  else if(!S.staff.length) html=brandBar()+viewSetup();
  else if(!me()) html=brandBar()+viewLogin();
  else {
    const m=me(); let tab=S.tab; if(!m.isAdmin) tab="clock";
    const views={clock:viewClock,today:viewToday,records:viewRecords,leave:viewLeave,payslips:viewPayslips,staff:viewStaff,roles:viewRoles,settings:viewSettings};
    html=brandBar()+tabsBar()+(views[tab]||viewClock)();
  }
  app.innerHTML=html;
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus({preventScroll:true}); if(sel) try{el.setSelectionRange(sel[0],sel[1]);}catch(e){} } }
}

/* live clock tick without full re-render */
setInterval(()=>{
  document.querySelectorAll("[data-clock]").forEach(el=>{ const n=new Date(),h=n.getHours(); el.innerHTML=`${((h+11)%12)+1}:${pad(n.getMinutes())}<small>${pad(n.getSeconds())} ${h<12?"AM":"PM"}</small>`; });
  document.querySelectorAll("[data-today]").forEach(el=>{ const st=+el.dataset.today; if(st) el.textContent=hm(+el.dataset.base + (Date.now()-st)/60000); });
  if(S.logoutAt){ const left=Math.ceil((S.logoutAt-Date.now())/1000); if(left<=0) logout(); else { const c=document.querySelector("[data-countdown]"); if(c) c.textContent=left; } }
},1000);

/* ---------- actions ---------- */
async function run(fn, errKey){
  try { S.busy=true; await fn(); }
  catch(e){
    const msg = e?.code==="permission-denied" ? "Firebase blocked this change. Check that the Firestore rules allow the pc_ collections."
      : e?.code==="resource-exhausted" ? "The Firebase daily limit was reached. Try again later or upgrade the Firebase plan."
      : e?.code==="unavailable" ? "No connection to the database. Check the internet and try again."
      : "That didn't save. Check your connection and try again.";
    if(errKey){ S.err[errKey]=msg; } else toast(msg,true);
  }
  finally { S.busy=false; render(); }
}
const validPin = p => /^\d{4,6}$/.test(p||"");
const uname = u => (u||"").trim().toLowerCase();

  }

document.addEventListener("click", async e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  const act=b.dataset.act, id=b.dataset.id, m=me();
  switch(act){
    case "logout": logout(); break;
    case "tab": S.tab=b.dataset.v; ls.set("pc.tab",S.tab); S.confirm=null; S.err={}; if(S.tab==="today"){subs._key=undefined; startSubs();} render(); break;
    case "stay": S.logoutAt=null; render(); break;
    case "ask": S.confirm=b.dataset.v; render(); break;
    case "cancel-confirm": S.confirm=null; render(); break;

    case "punch-in":
      if(S.mine.some(p=>p.open) || !deviceOk()) return;
      await run(async()=>{ await S.db.collection("punches").add({staffId:m.id, in:Date.now(), out:null, open:true}); toast(`Timed in at ${fmtTime(Date.now())}`); afterPunch(); });
      break;
    case "punch-out": {
      const open=S.mine.find(p=>p.open); if(!open || !deviceOk()) return;
      await run(async()=>{ const now=Date.now(); await S.db.doc("punches/"+open.id).update({out:now, open:false}); toast(`Timed out at ${fmtTime(now)} · ${hm((now-open.in)/60000)} worked`); afterPunch(); });
      break; }

    /* records */
    case "load-recs": {
      const r=S.rec; if(!r.from||!r.to){ toast("Choose both dates.",true); return; }
      stopSub("recs"); r.rows=[];
      subs.recs = S.db.collection("punches").where("in",">=",parseDay(r.from)).where("in","<",parseDay(r.to)+86400000).orderBy("in","asc").limit(1000)
        .onSnapshot(s=>{ r.rows=s.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>toast("Couldn't load records.",true));
      render(); break; }
    case "edit-punch": S.editPunch=id; clearDrafts("ep-"); S.err.punch=null; render(); break;
    case "cancel-punch": S.editPunch=null; clearDrafts("ep-"); render(); break;
    case "save-punch": {
      const p=(S.rec.rows||[]).find(x=>x.id===id); if(!p) return;
      const inMs=new Date(D("ep-in",toLocalInput(p.in))).getTime(), outV=D("ep-out",toLocalInput(p.out)), outMs=outV?new Date(outV).getTime():null;
      if(!inMs){ S.err.punch="Enter a valid time in."; render(); return; }
      if(outMs && outMs<=inMs){ S.err.punch="Time out must be after time in."; render(); return; }
      await run(async()=>{ await S.db.doc("punches/"+id).set({staffId:p.staffId, in:inMs, out:outMs, open:!outMs, edited:Date.now()}); S.editPunch=null; clearDrafts("ep-"); toast("Punch updated"); },"punch");
      break; }
    case "del-punch": await run(async()=>{ await S.db.doc("punches/"+id).delete(); S.confirm=null; toast("Punch deleted"); }); break;
    case "add-punch": {
      const sid=D("mp-staff"), inMs=new Date(D("mp-in")).getTime(), outMs=D("mp-out")?new Date(D("mp-out")).getTime():null;
      if(!sid||!inMs){ S.err.mp="Choose staff and a time in."; render(); return; }
      if(outMs && outMs<=inMs){ S.err.mp="Time out must be after time in."; render(); return; }
      await run(async()=>{ await S.db.collection("punches").add({staffId:sid, in:inMs, out:outMs, open:!outMs, edited:Date.now()}); clearDrafts("mp-"); S.err.mp=null; toast("Punch added"); },"mp");
      break; }

    /* leave */
    case "add-leave": {
      const today=dayKey(Date.now()), sid=D("lv-staff"), from=D("lv-from",today), to=D("lv-to",from);
      if(!sid){ S.err.lv="Choose who the leave is for."; render(); return; }
      if(!from||!to||to<from){ S.err.lv="The end date can't be before the start date."; render(); return; }
      const half = from===to && !!D("lv-half",false);
      const clash = S.leaves.find(l=>l.staffId===sid && l.from<=to && l.to>=from);
      if(clash){ S.err.lv=`${staffName(sid)} already has ${clash.type.toLowerCase()} leave on ${fmtRange(clash.from,clash.to)}. Remove it first or pick other dates.`; render(); return; }
      await run(async()=>{ await S.db.collection("leaves").add({staffId:sid, type:D("lv-type","Vacation"), from, to, half, paid:!!D("lv-paid",true), note:String(D("lv-note")).trim(), created:Date.now(), by:S.meId});
        const n=half?0.5:dayCount(from,to); clearDrafts("lv-"); S.err.lv=null; toast(`${n} day${n===1?"":"s"} of leave filed for ${staffName(sid)}`); },"lv");
      break; }
    case "toggle-leave": { const l=S.leaves.find(x=>x.id===id); if(!l) return;
      await run(async()=>{ await S.db.doc("leaves/"+id).update({paid:!l.paid}); toast(`Marked as ${l.paid?"unpaid":"paid"}`); }); break; }
    case "del-leave": await run(async()=>{ await S.db.doc("leaves/"+id).delete(); S.confirm=null; toast("Leave removed"); }); break;

    /* payslips */
    case "period": { const c=cutoff(b.dataset.v); S.slip.from=c[0]; S.slip.to=c[1]; S.slip.punches=null; S.slip.adj=[]; render(); break; }
    case "gen-slip": {
      const sl=S.slip; if(!sl.staffId||!sl.from||!sl.to) return;
      if(parseDay(sl.to)<parseDay(sl.from)){ toast("The end date is before the start date.",true); return; }
      sl.loading=true; render();
      try{
        const snap=await S.db.collection("punches").where("in",">=",parseDay(sl.from)).where("in","<",parseDay(sl.to)+86400000).orderBy("in","asc").get();
        sl.punches=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.staffId===sl.staffId);
      }catch(err){ toast("Couldn't load punches for this period.",true); }
      sl.loading=false; render(); break; }
    case "add-adj": S.slip.adj.push({label:"",amount:""}); render(); break;
    case "del-adj": S.slip.adj.splice(+b.dataset.i,1); render(); break;
    case "pdf": makePdf(); break;

    /* roles */
    case "add-role": case "save-role": {
      const p= act==="add-role" ? "nr-" : "er-"; const r = act==="save-role" ? S.roles.find(x=>x.id===id) : null;
      const v=(f,def)=>D(p+f, r?(r[f]??def):def);
      const rs=readShift(p, r?.shift);
      const data={name:String(v("name","")).trim(), basis:v("basis","daily"), rate:+v("rate",0), shift:rs.shift, otMode:v("otMode","multiplier"), otValue:+v("otValue",1.25)};
      if(!data.name){ S.err.role="Give the role a name."; render(); return; }
      if(!(data.rate>0)){ S.err.role="Enter a base rate above zero."; render(); return; }
      if(rs.error){ S.err.role=rs.error; render(); return; }
      await run(async()=>{
        if(r) await S.db.doc("roles/"+r.id).set(data); else await S.db.collection("roles").add(data);
        clearDrafts(p); S.editRole=null; S.err.role=null; toast(r?"Role saved":"Role added");
      },"role"); break; }
    case "edit-role": S.editRole=id; clearDrafts("er-"); render(); break;
    case "cancel-role": S.editRole=null; clearDrafts("er-"); render(); break;
    case "del-role": await run(async()=>{ await S.db.doc("roles/"+id).delete(); S.confirm=null; toast("Role deleted"); }); break;

    /* staff */
    case "add-staff": {
      const name=D("ns-name").trim(), u=uname(D("ns-user")), pin=D("ns-pin");
      if(!name||!u){ S.err.staff="Enter a name and username."; render(); return; }
      if(!/^[a-z0-9._-]+$/.test(u)){ S.err.staff="Usernames can use letters, numbers, dots, dashes and underscores."; render(); return; }
      if(S.staff.some(s=>s.username===u)){ S.err.staff=`The username "${u}" is taken.`; render(); return; }
      if(!validPin(pin)){ S.err.staff="PIN must be 4 to 6 digits."; render(); return; }
      await run(async()=>{ await S.db.collection("staff").add({name, username:u, pinHash:await hashPin(u,pin), roleId:D("ns-role"), isAdmin:!!D("ns-admin",false), active:true, created:Date.now()}); clearDrafts("ns-"); S.err.staff=null; toast(`${name} added`); },"staff");
      break; }
    case "edit-staff": S.editStaff=id; clearDrafts("es-"); S.err.es=null; render(); break;
    case "cancel-staff": S.editStaff=null; clearDrafts("es-"); render(); break;
    case "save-staff": {
      const s=S.staff.find(x=>x.id===id); if(!s) return;
      const isAdmin=!!D("es-admin",!!s.isAdmin), active=!!D("es-active",s.active!==false), pin=D("es-pin");
      const otherAdmins=S.staff.filter(x=>x.id!==id && x.isAdmin && x.active!==false).length;
      if(s.isAdmin && (!isAdmin||!active) && !otherAdmins){ S.err.es="Keep at least one active admin."; render(); return; }
      if(pin && !validPin(pin)){ S.err.es="PIN must be 4 to 6 digits."; render(); return; }
      const upd={name:String(D("es-name",s.name)).trim()||s.name, roleId:D("es-role",s.roleId||""), isAdmin, active};
      if(D("es-own",hasShift(s.shift))){
        const rs=readShift("es-", hasShift(s.shift)?s.shift:shiftOf({roleId:upd.roleId}));
        if(rs.error){ S.err.es=rs.error; render(); return; }
        upd.shift=rs.shift;
      } else upd.shift=null;
      if(pin) upd.pinHash=await hashPin(s.username,pin);
      await run(async()=>{ await S.db.doc("staff/"+id).update(upd); S.editStaff=null; clearDrafts("es-"); toast("Staff saved"); },"es");
      break; }

    case "save-settings":
      {
        const otRaw=D("st-otmin",otMinOf()), otMin=Math.round(+otRaw);
        if(otRaw==="" || !(otMin>=0) || otMin>720){ toast("Enter overtime minimum minutes between 0 and 720.",true); return; }
        await run(async()=>{ await S.db.doc("config/settings").set({...S.settings, company:String(D("st-company",S.settings.company)).trim(), currency:String(D("st-cur",S.settings.currency||"PHP")).trim().toUpperCase()||"PHP", kiosk:!!D("st-kiosk",S.settings.kiosk!==false), otMinMins:otMin, deductShort:!!D("st-short",S.settings.deductShort!==false)});
          for(const k of ["st-company","st-cur","st-kiosk","st-otmin","st-short"]) delete S.drafts[k]; toast("Settings saved"); });
      }
      break;

    /* approved devices */
    case "approve-device": {
      if(!DEVICE_ID) return;
      const name=String(D("dv-name",guessDeviceName())).trim()||guessDeviceName();
      await run(async()=>{ await S.db.doc("devices/"+DEVICE_ID).set({name, created:Date.now(), by:S.meId}); clearDrafts("dv-"); toast(`${name} approved`); });
      break; }
    case "del-device":
      await run(async()=>{ await S.db.doc("devices/"+id).delete(); S.confirm=null; toast("Device removed"); });
      break;
    case "save-lock": {
      const lock=!!D("st-lock",!!S.settings.deviceLock);
      if(lock && !S.devices.length){ S.err.lock="Approve at least one device before turning the lock on."; render(); return; }
      await run(async()=>{ await S.db.doc("config/settings").set({...S.settings, deviceLock:lock}); clearDrafts("st-lock"); S.err.lock=null; toast(lock?"Device lock is on":"Device lock is off"); },"lock");
      break; }
  }
});

  doc.setDrawColor(...muted); doc.setLineWidth(.6);
  doc.line(M, y, M+190, y); doc.line(W-M-190, y, W-M, y);
  doc.text("Prepared by", M, y+12); doc.text("Received by (employee signature)", W-M-190, y+12);
  doc.text(`Generated ${new Date().toLocaleString()}`, M, doc.internal.pageSize.getHeight()-28);
  const safe=s=>s.replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"");
  try{
    const fname=`Payslip-${safe(st.name)}-${sl.from}-to-${sl.to}.pdf`;
    doc.save(fname);
    toast("Payslip saved");
  }catch(err){
    if(err?.code==="declined") return;
    toast(err?.code==="rate_limited" ? "A save prompt is already open." : "The payslip couldn't be saved here.", true);
  }
}
})();
</script>
</body>
</html>
